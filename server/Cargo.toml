[package]
name = "proof-battle-server"
version = "0.1.0"
edition = "2024"
default-run = "proof-battle-server"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9.1"
rand_chacha = "0.9.0"
rand_core = "0.9.3"
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
ts-rs = { version = "10", features = ["serde-compat", "uuid-impl"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "migrate"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tokio-tungstenite = "0.24"

[dev-dependencies]
